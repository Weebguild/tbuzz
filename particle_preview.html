<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AntiGravity Particle Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=Outfit:wght@300;400;500;700;900&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Outfit', 'Inter', sans-serif;
            color: white;
            cursor: crosshair;
        }

        .hero-title {
            background: linear-gradient(to bottom, #fff 40%, rgba(255, 255, 255, 0.4));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            mix-blend-mode: difference;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }
    </style>
</head>
<body>
    <!-- Background Canvas -->
    <div id="container" class="absolute inset-0 z-0 overflow-hidden bg-black">
        <canvas id="particleCanvas" class="block w-full h-full"></canvas>
    </div>

    <!-- Navigation -->
    <nav class="absolute top-0 left-0 w-full z-20 flex justify-between items-center p-6 md:p-8">
        <div class="flex items-center space-x-2">
             <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center">
                <span class="font-bold text-black text-lg">G</span>
             </div>
             <span class="text-white font-medium tracking-wide text-lg">Antigravity</span>
        </div>
        <div class="hidden md:flex space-x-8 text-sm font-medium text-white/70">
            <a href="#" class="hover:text-white transition-colors">Experiments</a>
            <a href="#" class="hover:text-white transition-colors">Case Studies</a>
            <a href="#" class="hover:text-white transition-colors">About</a>
        </div>
        <button class="text-white/80 hover:text-white transition-colors">
            <i data-lucide="info" size="24"></i>
        </button>
    </nav>

    <!-- Hero Content -->
    <div class="absolute inset-0 z-10 flex flex-col items-center justify-center pointer-events-none px-4">
        <div class="max-w-4xl w-full text-center space-y-8">
            <div class="inline-block animate-fade-in-up">
                <span class="py-1 px-3 border border-white/20 rounded-full text-xs font-mono text-white/60 tracking-widest uppercase bg-white/5 backdrop-blur-sm">
                    Experimental Interaction
                </span>
            </div>
            
            <h1 class="hero-title text-6xl md:text-8xl lg:text-9xl font-bold tracking-tighter">
                Zero<br/>Gravity
            </h1>
            
            <p class="max-w-2xl mx-auto text-lg md:text-xl text-white/60 font-light leading-relaxed">
                Experience the fluidity of data. A WebGL-inspired particle simulation running entirely on 2D Canvas for maximum compatibility and performance.
            </p>

            <div class="pt-8 pointer-events-auto">
                <button class="group relative inline-flex items-center gap-3 px-8 py-4 bg-white text-black rounded-full font-bold tracking-wide overflow-hidden transition-transform hover:scale-105 active:scale-95">
                    <span class="relative z-10">Start Experience</span>
                    <i data-lucide="arrow-right" class="w-4 h-4 relative z-10"></i>
                    <div class="absolute inset-0 bg-blue-500 transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-300 ease-out opacity-10"></div>
                </button>
            </div>
        </div>
    </div>

    <!-- Scroll Indicator -->
    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 text-white/30 animate-pulse pointer-events-none">
       <span class="text-[10px] uppercase tracking-[0.2em]">Interact</span>
       <i data-lucide="mouse-pointer-2" size="16"></i>
    </div>

    <!-- Debug Info Overlay -->
    <div id="debug" class="absolute bottom-4 right-4 pointer-events-none text-xs text-white/20 font-mono text-right">
        <p><span id="particleCount">0</span> entities</p>
        <p><span id="fps">0</span> FPS</p>
    </div>

    <script>
        // --- Configuration Constants ---
        const PARTICLE_DENSITY = 0.00015;
        const BG_PARTICLE_DENSITY = 0.00005;
        const MOUSE_RADIUS = 180;
        const RETURN_SPEED = 0.08;
        const DAMPING = 0.90;
        const REPULSION_STRENGTH = 1.2;

        const canvas = document.getElementById('particleCanvas');
        const container = document.getElementById('container');
        const countEl = document.getElementById('particleCount');
        const fpsEl = document.getElementById('fps');
        const ctx = canvas.getContext('2d');

        let particles = [];
        let backgroundParticles = [];
        let mouse = { x: -1000, y: -1000, isActive: false };
        let lastTime = 0;

        const randomRange = (min, max) => Math.random() * (max - min) + min;

        function initParticles(width, height) {
            const particleCount = Math.floor(width * height * PARTICLE_DENSITY);
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                particles.push({
                    x, y,
                    originX: x, originY: y,
                    vx: 0, vy: 0,
                    size: randomRange(1, 2.5),
                    color: Math.random() > 0.9 ? '#4285F4' : '#ffffff',
                    angle: Math.random() * Math.PI * 2
                });
            }

            const bgCount = Math.floor(width * height * BG_PARTICLE_DENSITY);
            backgroundParticles = [];
            for (let i = 0; i < bgCount; i++) {
                backgroundParticles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.2,
                    vy: (Math.random() - 0.5) * 0.2,
                    size: randomRange(0.5, 1.5),
                    alpha: randomRange(0.1, 0.4),
                    phase: Math.random() * Math.PI * 2
                });
            }
            countEl.textContent = particleCount + bgCount;
        }

        function animate(time) {
            const delta = time - lastTime;
            lastTime = time;
            if (delta > 0) {
                fpsEl.textContent = Math.round(1000 / delta);
            }

            ctx.clearRect(0, 0, canvas.width / devicePixelRatio, canvas.height / devicePixelRatio);

            // --- Background Glow ---
            const centerX = canvas.width / devicePixelRatio / 2;
            const centerY = canvas.height / devicePixelRatio / 2;
            const pulseOpacity = Math.sin(time * 0.0008) * 0.035 + 0.085;
            const gradient = ctx.createRadialGradient(
                centerX, centerY, 0,
                centerX, centerY, Math.max(canvas.width, canvas.height) / devicePixelRatio * 0.7
            );
            gradient.addColorStop(0, `rgba(66, 133, 244, ${pulseOpacity})`);
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width / devicePixelRatio, canvas.height / devicePixelRatio);

            // --- Background Particles ---
            ctx.fillStyle = "#ffffff";
            for (let p of backgroundParticles) {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0) p.x = canvas.width / devicePixelRatio;
                if (p.x > canvas.width / devicePixelRatio) p.x = 0;
                if (p.y < 0) p.y = canvas.height / devicePixelRatio;
                if (p.y > canvas.height / devicePixelRatio) p.y = 0;

                const twinkle = Math.sin(time * 0.002 + p.phase) * 0.5 + 0.5;
                ctx.globalAlpha = p.alpha * (0.3 + 0.7 * twinkle);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            // --- Foreground Physics ---
            for (let p of particles) {
                const dx = mouse.x - p.x;
                const dy = mouse.y - p.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (mouse.isActive && distance < MOUSE_RADIUS) {
                    const force = (MOUSE_RADIUS - distance) / MOUSE_RADIUS;
                    const repulsion = force * REPULSION_STRENGTH;
                    p.vx -= (dx / distance) * repulsion * 5;
                    p.vy -= (dy / distance) * repulsion * 5;
                }
                p.vx += (p.originX - p.x) * RETURN_SPEED;
                p.vy += (p.originY - p.y) * RETURN_SPEED;
            }

            // Collisions
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const p1 = particles[i];
                    const p2 = particles[j];
                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const distSq = dx * dx + dy * dy;
                    const minDist = p1.size + p2.size;
                    if (distSq < minDist * minDist) {
                        const dist = Math.sqrt(distSq);
                        if (dist > 0.01) {
                            const nx = dx / dist;
                            const ny = dy / dist;
                            const overlap = minDist - dist;
                            p1.x -= nx * overlap * 0.5;
                            p1.y -= ny * overlap * 0.5;
                            p2.x += nx * overlap * 0.5;
                            p2.y += ny * overlap * 0.5;

                            const dvx = p1.vx - p2.vx;
                            const dvy = p1.vy - p2.vy;
                            const velocityAlongNormal = dvx * nx + dvy * ny;
                            if (velocityAlongNormal > 0) {
                                const restitution = 0.85;
                                const impulseMagnitude = (-(1 + restitution) * velocityAlongNormal) / (1 / p1.size + 1 / p2.size);
                                p1.vx += (impulseMagnitude * nx) / p1.size;
                                p1.vy += (impulseMagnitude * ny) / p1.size;
                                p2.vx -= (impulseMagnitude * nx) / p2.size;
                                p2.vy -= (impulseMagnitude * ny) / p2.size;
                            }
                        }
                    }
                }
            }

            // Drawing
            for (let p of particles) {
                p.vx *= DAMPING; p.vy *= DAMPING;
                p.x += p.vx; p.y += p.vy;

                const velocity = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                const opacity = Math.min(0.3 + velocity * 0.1, 1);
                ctx.fillStyle = p.color === '#ffffff' ? `rgba(255, 255, 255, ${opacity})` : p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(animate);
        }

        function handleResize() {
            const { width, height } = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            ctx.scale(dpr, dpr);
            initParticles(width, height);
        }

        window.addEventListener('resize', handleResize);
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
            mouse.isActive = true;
        });
        container.addEventListener('mouseleave', () => mouse.isActive = false);

        handleResize();
        requestAnimationFrame(animate);
        lucide.createIcons();
    </script>
</body>
</html>
